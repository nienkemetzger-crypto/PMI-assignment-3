[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools', 'wheel']

[project]
name = 'pmi-lib'
version = '0.0.2'
description = 'PMI library - Group 4'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
  {name = 'Galina Mencej', email = 'g.mencej@students.uu.nl'},
  {name = 'Lucia van den Boogaart Castro', email = 'l.vandenboogaart@students.uu.nl'},
  {name = 'Fé Verheyen', email = 'f.verheyen@students.uu.nl'},
  {name = 'Nienke Metzger', email = 'n.metzger@students.uu.nl'},
]
dependencies = ["nibabel", "numpy", "pydicom", "pmi_viewer", "scipy", "click", "gdcm", "pylibjpeg", "pylibjpeg-libjpeg", "setuptools", "joblib"]

[project.scripts]
dicom-to-nifti = "pmi_lib.main:dicom_to_nifti_click"